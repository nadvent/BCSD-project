# Blood Cell Semantic Segmentation (BCSD) Default Configuration

data:
  train_dir: "./data/train"
  val_dir: "./data/test"
  input_height: 416
  input_width: 416
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]

model:
  in_channels: 3
  out_channels: 1
  padding: 0

training:
  output_dir: "./outputs"
  epochs: 20
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  bce_weight: 0.5

export:
  weights: "./outputs/best_model.pth"
  output: "./outputs/model.onnx"
  opset_version: 17

inference:
  prob_threshold: 0.5
  device: "auto"
  warmup: 1
